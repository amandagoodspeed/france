<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>France 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="France 2026">

<meta name="theme-color" content="#284270">
<style>
  :root {
    --blue: #284270;
    --blue2: #365a96;
    --cream: #f3efe6;
    --white: #ffffff;
    --muted: #6f7890;
    --line: #d9deea;
    --red: #EF4135;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.13), transparent 28%),
      linear-gradient(135deg, var(--blue2), var(--blue));
    color: var(--white);
    display: grid;
    place-items: center;
    padding: 22px;
  }
  .card {
    width: min(420px, 100%);
    background: rgba(255,255,255,0.96);
    color: #18233d;
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 24px 70px rgba(10,18,35,0.32);
  }
  .icon {
    width: 78px;
    height: 78px;
    border-radius: 18px;
    display: block;
    margin: 0 auto 18px;
    box-shadow: 0 10px 26px rgba(25,36,63,0.22);
  }
  h1 {
    margin: 0 0 6px;
    text-align: center;
    font-size: 1.7rem;
    letter-spacing: -0.02em;
  }
  p {
    margin: 0 0 20px;
    text-align: center;
    color: var(--muted);
    line-height: 1.45;
  }
  label {
    display: block;
    font-weight: 700;
    font-size: 0.82rem;
    margin: 0 0 8px;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 14px 14px;
    font-size: 1rem;
    outline: none;
    margin-bottom: 12px;
  }
  input[type="password"]:focus, input[type="text"]:focus {
    border-color: var(--blue2);
    box-shadow: 0 0 0 4px rgba(54,90,150,0.13);
  }
  .remember {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 4px 0 16px;
    color: #2d3852;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .remember input { margin-top: 3px; }
  button {
    width: 100%;
    border: 0;
    border-radius: 999px;
    padding: 14px 18px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: white;
    background: var(--blue);
    font-size: 0.82rem;
    cursor: pointer;
  }
  button:hover { background: #19243f; }
  .msg {
    min-height: 24px;
    margin-top: 14px;
    font-size: 0.9rem;
    color: var(--red);
    text-align: center;
  }
  .small {
    margin-top: 16px;
    font-size: 0.78rem;
    color: #7d8494;
    text-align: center;
    line-height: 1.35;
  }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="./apple-touch-icon.png" alt="">
    <h1>France 2026</h1>
    <p>This itinerary is encrypted. Enter the password to unlock it.</p>
    <form id="unlockForm">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus>
      <label class="remember">
        <input id="remember" type="checkbox">
        <span>Remember this password on this device</span>
      </label>
      <button type="submit">Unlock itinerary</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="small">Only save the password on your own private phone or computer.</div>
  </main>

<script>
(function(){
  const STORAGE_KEY = "france_2026_saved_password_v1";
  const form = document.getElementById("unlockForm");
  const passwordInput = document.getElementById("password");
  const rememberInput = document.getElementById("remember");
  const msg = document.getElementById("msg");
  const payload = JSON.parse(document.getElementById("encryptedPayload").textContent);

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(password) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw",
      enc.encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: b64ToBytes(payload.salt),
        iterations: payload.iter,
        hash: "SHA-256"
      },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function unlock(password, shouldRemember) {
    msg.textContent = "Unlocking...";
    try {
      const key = await deriveKey(password);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(payload.iv) },
        key,
        b64ToBytes(payload.ct)
      );
      if (shouldRemember) {
        localStorage.setItem(STORAGE_KEY, password);
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
      const html = new TextDecoder().decode(plaintext);
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      msg.textContent = "Wrong password. Please try again.";
    }
  }

  form.addEventListener("submit", function(e) {
    e.preventDefault();
    unlock(passwordInput.value, rememberInput.checked);
  });

  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    rememberInput.checked = true;
    passwordInput.value = saved;
    unlock(saved, true);
  }
})();
</script>
